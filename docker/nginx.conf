# Serves the built studio. Mounted over the image's default.conf; MIME types
# come from the base image's http-level `include /etc/nginx/mime.types`.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes everything under /assets/, so those bytes can never
    # change under a given name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one unhashed file: it names the current bundle, so a
    # cached copy pins the studio to an old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The studio has no router today; this is insurance, not a current need.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
